name: Radar Events Pipeline

on:
  schedule:
    # 每週二、四、六 早上 9:00 (UTC+8 = UTC+0 01:00)
    - cron: '0 1 * * 2,4,6'
  workflow_dispatch:  # 允許手動觸發

jobs:
  scrape-and-post-radar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Scrape Radar Events
        run: |
          python scrape_activity_radar.py
      
      - name: Generate Preview
        run: |
          python preview_generator.py
      
      - name: Upload Preview Artifact
        uses: actions/upload-artifact@v3
        with:
          name: radar-preview
          path: |
            preview.html
            data/radar_events.json
            data/preview_cache/
      
      - name: Post to Threads (if enabled)
        if: github.event_name == 'schedule'  # 只在排程時自動發文
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          # 自動發文模式（跳過確認）
          echo "y" | python post_radar_to_threads.py
      
      - name: Cleanup
        run: |
          rm -rf data/preview_cache/
