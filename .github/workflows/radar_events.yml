name: Radar Events Pipeline

on:
  schedule:
    # 每週二、四、六 早上 9:00 (UTC+8 = UTC+0 01:00)
    - cron: '0 1 * * 2,4,6'
  workflow_dispatch:  # 允許手動觸發

jobs:
  scrape-and-post-radar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create data directory
        run: |
          mkdir -p data

      - name: Cache Performer History
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: ${{ runner.os }}-performer-history-radar-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-performer-history-
      
      - name: Scrape Radar Events
        run: |
          python scrape_activity_radar.py
      
      - name: Generate Preview
        run: |
          python preview_generator.py
      
#      - name: Post to Threads (auto mode)
#        env:
#          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
#        run: |
#          python post_radar_to_threads.py --auto

      - name: Generate Performance Dashboard
        if: always()
        run: python scripts/generate_dashboard.py

      - name: Upload Radar Guide Artifact & Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: radar-manual-guide
          path: |
            preview.html
            data/radar_events.json
            data/preview_cache/
            data/scraping_errors.json
            data/dashboard.html

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py --type radar --name "樂團雷達站"
      
      - name: Cleanup
        run: |
          rm -rf data/preview_cache/ preview.html data/dashboard.html
