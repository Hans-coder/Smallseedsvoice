name: Digest - Daily & Weekly (全台音樂活動每日同步與週報)

on:
  schedule:
    # 每天清晨 06:00 執行 (台灣時間 UTC+8 即 UTC 22:00)，自動爬取最新售票活動並同步至官網
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  digest-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Cache Performer History
        uses: actions/cache@v5
        with:
          path: data/events.db
          key: ${{ runner.os }}-performer-history-weekly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-performer-history-weekly-
            ${{ runner.os }}-performer-history-

      # ── 全平台抓取（StreetVoice ➔ KKTIX ➔ iNDIEVOX ➔ tixCraft ➔ TicketPlus）──
      - name: Scrape All Sources & Cross-Platform Deduplicate
        run: python run_weekly_digest.py --step scrape --source all

      # ── AI 摘要與內容生成（週一至週日完整行事曆）─────────────────
      - name: Process & Generate Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_weekly_digest.py --step process

      # ── 自動同步更新展演空間 Web 資料庫至 GitHub Pages ──────
      - name: Commit and push updated web data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/*.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update livehouse web events and digest posts" && git push)

      # ── 生成社群視覺圖卡 ─────────────────────────────────────────
      - name: Generate Social Media Cards
        run: python scripts/create_social_cards.py --source digest --render
        continue-on-error: true

      # ── 送出 Discord 整合通知 ───────────────────────────────────
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py --type digest --name "每週音樂活動整合週報"

      # ── 封存週報資料與圖卡 ─────────────────────────────────────
      - name: Archive Digest Data & Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-digest-complete-${{ github.run_id }}
          path: |
            data/digest_raw.json
            data/digest_posts.json
            data/scraping_errors.json
            artifacts/social_cards.html
            artifacts/card_*.jpg
          retention-days: 7

      - name: Cleanup Temporary Artifacts
        if: always()
        run: rm -rf artifacts/card_*.jpg artifacts/social_cards.html
