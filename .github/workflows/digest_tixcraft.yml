name: Digest - tixCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1,4' # Monday and Thursday at 10:30 AM (UTC+8)

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Cache Performer History
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: ${{ runner.os }}-performer-history-tixcraft-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-performer-history-tixcraft-
            ${{ runner.os }}-performer-history-
            
      - name: Run Pipeline (tixCraft)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p data
          python run_weekly_digest.py --source tixcraft --step all
          
      - name: Render Social Cards
        run: |
          if [ -f data/digest_raw.json ]; then
            python scripts/create_social_cards.py --render
          fi
          
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/notify_discord.py --type digest --name "tixCraft 精選"
          
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-tixcraft-${{ github.run_id }}
          path: |
            data/
            artifacts/
            scraping_errors.json
          retention-days: 1
