name: Radar - 每日熱門偵測

on:
  schedule:
    # 每天固定時段 + workflow 內加隨機延遲，避免被識別為機器人
    # UTC 01:00 = 台灣 09:00（每天早上）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ── 隨機延遲 0~30 分鐘，模擬真人操作時間 ──────────────
      - name: Random startup delay (anti-bot)
        run: |
          DELAY=$((RANDOM % 1800))
          echo "⏳ 隨機延遲 ${DELAY} 秒（$(( DELAY / 60 )) 分 $(( DELAY % 60 )) 秒）後開始..."
          sleep $DELAY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install -r requirements.txt
          playwright install chromium

      # ── 先刷新 StreetVoice 快取 ──────────────────────────
      - name: Refresh StreetVoice Cache
        run: python run_weekly_digest.py --step scrape --source streetvoice
        continue-on-error: true  # SV 掛掉不影響整體

      # ── 主偵測（含 KKTIX + StreetVoice + IG）─────────────
      - name: Detect Trending Concerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/detect_trending.py

      # ── 若 IG 被擋則改用 --skip-ig 重試 ──────────────────
      - name: Detect Trending (IG fallback - skip IG if failed)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/detect_trending.py --skip-ig

      # ── 生成自製圖片框 ─────────────────────────────────────
      - name: Generate Social Media Cards
        run: python scripts/create_social_cards.py --source radar --render
        continue-on-error: true  # 圖卡失敗不影響後續通知

      # ── 送出含圖卡的 Discord 通知 ──────────────────────────
      - name: Notify Discord (with image cards)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py --type radar --name "每日熱門偵測"

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trending-${{ github.run_id }}
          path: |
            data/trending_concerts.json
            data/radar_events.json
            data/streetvoice_raw.json
            artifacts/social_cards.html
            artifacts/card_*.jpg
          retention-days: 3
