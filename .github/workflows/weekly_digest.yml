name: Weekly Digest Pipeline

on:
  schedule:
    # Sunday 20:00 Taiwan (UTC+8) -> 12:00 UTC
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chrome & Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver

      - name: Scrape Instagram
        run: python run_weekly_digest.py --step scrape
        
      - name: Process & Generate Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_weekly_digest.py --step process
        
      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python run_weekly_digest.py --step post
      
      - name: Archive Digest Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-data
          path: |
             data/digest_raw.json
             data/digest_posts.json
          retention-days: 7
          
      - name: Cleanup
        if: always()
        run: rm -rf data/preview_cache/
