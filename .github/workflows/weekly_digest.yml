name: Weekly Digest Pipeline

on:
  schedule:
    # Runs at 20:00 (UTC+8) every Sunday
    # GitHub Actions uses UTC time. 20:00 TW = 12:00 UTC.
    - cron: '0 12 * * 0'
  workflow_dispatch:  # Allows manual trigger

jobs:
  run-digest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Setup Chrome (for Selenium if needed)
      uses: browser-actions/setup-chrome@latest
      
    - name: Run Weekly Digest
      env:
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
        LOG_LEVEL: INFO
      run: |
        python run_weekly_digest.py
