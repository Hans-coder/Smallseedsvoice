name: Sale Alarm Pipeline

# ⚠️ 此 workflow 已由 radar_detect.yml + radar_post.yml 取代。
# 保留此檔案作為備用（可手動觸發完整的官方平台售票掃描）。
on:
  workflow_dispatch:

jobs:
  check-and-post-alarm:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip cache purge
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Cache Performer History
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: ${{ runner.os }}-performer-history-sale-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-performer-history-

      - name: Scrape KKTIX
        run: python scripts/scrape_official_platforms.py --platform kktix
        


      - name: Scrape tixCraft
        run: python scripts/scrape_official_platforms.py --platform tixcraft
        
      - name: Scrape Indievox
        run: python scripts/scrape_official_platforms.py --platform indievox
        
      - name: Merge Data
        run: python scripts/scrape_official_platforms.py --merge
        
      - name: Check & Post Alarm
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/post_sale_alarm.py --auto
        
      - name: Generate Social Media Cards
        run: python scripts/create_social_cards.py --source sale --render

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py --type sale --name "售票情報鬧鐘"
      
      - name: Archive Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-data
          path: data/*.json
          retention-days: 1
