
    <!DOCTYPE html>
    <html lang="zh-TW">
    <head>
    <meta charset="UTF-8">
    <title>Social Media Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #2C2C2C;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            font-family: 'Noto Sans TC', sans-serif;
            justify-content: center;
        }
        /* IG Post Frame (1080x1350 scaled down for preview, 4:5 ratio) */
        .card {
            width: 1080px;
            height: 1350px;
            background: #F8F5F0; /* Japanese Paper Base */
            position: relative;
            box-sizing: border-box;
            border: 2px solid #C4B9A7;
            transform-origin: top left;
            zoom: 1.0; /* Scale for browser viewing or full for rendering */
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-inner {
            border: 3px solid #EBE4D5;
            margin: 24px;
            height: calc(100% - 48px);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .img-wrapper {
            width: 100%;
            height: 700px;
            overflow: hidden;
            border-bottom: 4px solid #1B4F8B;
            background: #E4DDD0;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.1);
        }
        .no-img {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-mark {
            font-size: 80px;
            font-weight: 900;
            color: #C4B9A7;
            letter-spacing: 15px;
            text-align: center;
            opacity: 0.5;
        }
        .content {
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .date-badge {
            display: inline-block;
            background: #C83220; /* Kurenai Red */
            color: #F8F5F0;
            font-size: 36px;
            font-weight: 900;
            padding: 10px 24px;
            align-self: flex-start;
            margin-bottom: 30px;
        }
        .title {
            font-size: 64px;
            font-weight: 900;
            color: #2E2724; /* Dark Ink */
            line-height: 1.2;
            word-wrap: break-word;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .venue {
            font-size: 38px;
            font-weight: 700;
            color: #1B4F8B; /* Ruri Blue */
            margin-bottom: 40px;
        }
        .ai-desc {
            background: #EBE4D5;
            border-left: 8px solid #D68516; /* Yamabuki */
            padding: 24px 30px;
            font-size: 34px;
            font-weight: 700;
            color: #5B483A;
            line-height: 1.5;
            margin-top: auto;
            margin-bottom: 20px;
        }
        .footer {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 24px;
            font-weight: 900;
            color: #9A8B78;
            letter-spacing: 4px;
        }
    </style>
    </head>
    <body>
        
        <div class="card">
            <div class="card-inner">
                <div class="img-wrapper"><img src="https://assets.kktix.io/upload_images/291642/20260528_Transformed_Traditions_-_The_Piano_Language_of_Liszt__Ligeti__and_Kurt%C3%A1g_04_medium.png" alt="變形的傳統 - 李斯特、利蓋蒂與庫爾塔格的鋼琴語言"/></div>
                <div class="content">
                    <div class="date-badge">2026-05-28</div>
                    <div class="title">變形的傳統 - 李斯特、利蓋蒂與庫爾塔格的鋼琴語言</div>
                    <div class="venue">📍 Unknown</div>
                    
                </div>
                <div class="footer">
                    TAIWAN MUSIC RADAR // smallseedsvoice 
                </div>
            </div>
        </div>
        
    </body>
    </html>
