// ════════════════════════════════════════════════════════════════
//  TEXT + LEADER LINES
//  Design: for each group, text is vertically centered at dot Y.
//  A vertical bracket runs along the map edge at the group's span.
//  A horizontal tick at dot Y shows which dot the group connects to.
// ════════════════════════════════════════════════════════════════
const FS   = 12.5;   // event text size
const FSL  = 14.5;   // city label size
const RH   = 13.6;   // row height (tighter)
const GAP  = 6;      // gap between groups
const LX   = 12;     // left col left x
const RXE  = W-12;   // right col right x (anchor end)

function renderGroups() {
  renderSide(LEFT_GROUPS,  'L');
  renderSide(RIGHT_GROUPS, 'R');
}

function renderSide(groups, side) {
  const isLeft = side === 'L';
  let prevBottom = MTY + 2;

  groups.forEach(grp => {
    // calculate average dot Y for block centering
    let sumY = 0;
    grp.cityKeys.forEach(k => sumY += CITIES[k].px[1]);
    const avgDotY = sumY / grp.cityKeys.length;

    // Total height: label + events
    const totalH = FSL + grp.events.length * RH;

    // Center block at avgDotY, uncoupling the downward motion by 25px
    let top = avgDotY - totalH / 2 - 25;
    top = Math.max(top, prevBottom + GAP);

    // Group anchor coords (dot next to text)
    const anchorX = isLeft ? ML - 16 : MR + 16;
    const anchorY = top + totalH / 2;

    // Draw lines to all actual city dots in this group
    grp.cityKeys.forEach(k => {
      const px = CITIES[k].px;
      const r = CITIES[k].r;
      const startX = isLeft ? anchorX + 3 : anchorX - 3;
      const endX   = isLeft ? px[0] - r - 2 : px[0] + r + 2;

      // Draw beautiful S-bezier curve
      lineG.append('path')
        .attr('d', `M ${startX},${anchorY} C ${isLeft? startX+50 : startX-50},${anchorY} ${isLeft? endX-50 : endX+50},${px[1]} ${endX},${px[1]}`)
        .attr('fill', 'none').attr('stroke', grp.col).attr('stroke-width', 1.4).attr('stroke-linecap', 'round').attr('opacity', 0.55);
    });

    // Draw the anchor dot
    dotG.append('circle').attr('cx', anchorX).attr('cy', anchorY).attr('r', 3)
      .attr('fill', '#F3ECE0').attr('stroke', grp.col).attr('stroke-width', 2);

    // ── City label & Alignment Hugging ──
    // Text blocks are aligned directly against the anchor nodes
    const lx      = isLeft ? anchorX - 14 : anchorX + 14;
    const anchor  = isLeft ? 'end' : 'start';
    const labelY  = top + FSL;

    svg.append('text').attr('x', lx).attr('y', labelY)
      .attr('font-size', FSL).attr('font-weight', 700)
      .attr('fill', grp.col).attr('text-anchor', anchor)
      .text(grp.label);

    // ── Event rows ──
    let y = labelY + RH;
    grp.events.forEach(([date, name]) => {
      const row = svg.append('text').attr('x', lx).attr('y', y)
        .attr('font-size', FS).attr('text-anchor', anchor);
      if (isLeft) {
        row.append('tspan').attr('fill','#1A1410').text(name + '  ');
        row.append('tspan').attr('fill','#9A8060').attr('font-size', 10.5).text(date);
      } else {
        row.append('tspan').attr('fill','#9A8060').attr('font-size', 10.5).text(date + '  ');
        row.append('tspan').attr('fill','#1A1410').text(name);
      }
      y += RH;
    });

    prevBottom = y + 2;
  });
}
