// ════════════════════════════════════════════════════════════════

  { cityKeys:['taitung'], label:'台東', col:COL.MOEGI, events:[ ['05/16','東浪嘉年華 EAST WAVE'], ['06～09月','月光・海音樂會'], ['11月','PASIWALI 音樂節'], ['11月','阿米斯音樂節'] ] },
  { cityKeys:['pingtung'], label:'屏東', col:COL.KIKYO, events:[ ['04/03','台灣祭 TAIWAN FEST'], ['04/10','屏東三大日'], ['04/10','南國國際生活節'] ] }

// ════════════════════════════════════════════════════════════════
//  LAYER GROUPS
// ════════════════════════════════════════════════════════════════
const mapG  = svg.append('g').attr('id','map');
const lineG = svg.append('g').attr('id','leaders').attr('fill','none');
const dotG  = svg.append('g').attr('id','dots');

// ════════════════════════════════════════════════════════════════
//  CORNER DECORATIONS (Ultra Premium Audiophile Vectors - Earthy Tone)
// ════════════════════════════════════════════════════════════════
const DEC_COL = '#C2B5A3';
;(()=>{
  const g=svg.append('g').attr('opacity',0.8).attr('transform','translate(40,40)');
  g.append('rect').attr('x',0).attr('y',0).attr('width',100).attr('height',70).attr('rx',4).attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',1.5);
  g.append('circle').attr('cx',35).attr('cy',35).attr('r',28).attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',1.5);
  g.append('circle').attr('cx',35).attr('cy',35).attr('r',26).attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',0.5);
  g.append('circle').attr('cx',35).attr('cy',35).attr('r',10).attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',1);
  g.append('circle').attr('cx',35).attr('cy',35).attr('r',1.5).attr('fill',COL.KURENAI);
  g.append('circle').attr('cx',80).attr('cy',15).attr('r',6).attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',2);
  g.append('line').attr('x1',80).attr('y1',21).attr('x2',65).attr('y2',55).attr('stroke',DEC_COL).attr('stroke-width',2);
  g.append('rect').attr('x',57).attr('y',50).attr('width',10).attr('height',14).attr('rx',1).attr('transform','rotate(25 62 57)').attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',1.5);
})();
;(()=>{
  const g=svg.append('g').attr('opacity',0.8).attr('transform','translate(940,40)');
  g.append('path').attr('d','M 0,35 C 20,5 25,5 30,35 C 35,65 40,65 45,35 C 50,5 55,5 60,35 C 65,65 70,65 75,35 C 80,5 85,5 95,35').attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',2.2);
  g.append('path').attr('d','M 0,45 C 20,15 25,15 30,45 C 35,75 40,75 45,45 C 50,15 55,15 60,45 C 65,75 70,75 75,45 C 80,15 85,15 95,45').attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',0.8);
})();
;(()=>{
  const g=svg.append('g').attr('opacity',0.8).attr('transform','translate(40,1260)');
  g.append('line').attr('x1',50).attr('y1',60).attr('x2',50).attr('y2',20).attr('stroke',DEC_COL).attr('stroke-width',3.5);
  g.append('path').attr('d','M 35,0 L 35,10 C 35,25 65,25 65,10 L 65,0').attr('fill','none').attr('stroke',DEC_COL).attr('stroke-width',3.5);
  g.append('circle').attr('cx',35).attr('cy',0).attr('r',2.5).attr('fill',DEC_COL);
  g.append('circle').attr('cx',65).attr('cy',0).attr('r',2.5).attr('fill',DEC_COL);
})();
;(()=>{

})();

// ════════════════════════════════════════════════════════════════
//  TITLE
// ════════════════════════════════════════════════════════════════
const titleG = svg.append('g').attr('transform','translate('+W/2+',110)');
titleG.append('text').attr('x',0).attr('y',0).attr('text-anchor','middle')
  .attr('font-size',72).attr('font-weight',900).attr('fill',COL.INK).attr('letter-spacing',20)
  .text('台灣音樂祭地圖');

titleG.append('rect').attr('x',-400).attr('y',20).attr('width',800).attr('height',2.5).attr('fill',COL.KURENAI);

titleG.append('text').attr('x',0).attr('y',45).attr('text-anchor','middle')
  .attr('font-size',16).attr('font-weight',700).attr('fill','#7C6B5E').attr('letter-spacing',6)
  .text('TAIWAN MUSIC FESTIVAL MAP 2026 // smallseedsvoice');

// ════════════════════════════════════════════════════════════════
//  LOAD TOPOJSON
// ════════════════════════════════════════════════════════════════
d3.json('https://cdn.jsdelivr.net/npm/taiwan-atlas/counties-10t.json').then(tw => {
  tw.objects.counties.geometries = tw.objects.counties.geometries.filter(
    d => !['金門縣', '連江縣', '澎湖縣'].includes(d.properties.COUNTYNAME)
  );

  const counties  = topojson.feature(tw, tw.objects.counties);
  const borders   = topojson.mesh(tw, tw.objects.counties, (a,b) => a !== b);
  const coastline = topojson.mesh(tw, tw.objects.counties, (a,b) => a === b);

  mapG.selectAll('path.county').data(counties.features).enter().append('path')
    .attr('class','county').attr('d', gPath)
    .attr('fill', '#DACDC0').attr('stroke','none');

  mapG.append('path').datum(borders).attr('d', gPath)
    .attr('fill','none').attr('stroke','#F8F5F0').attr('stroke-width',1.5).attr('stroke-linejoin','round');

  mapG.append('path').datum(coastline).attr('d', gPath)
    .attr('fill','none').attr('stroke','#9A8B78').attr('stroke-width',2).attr('stroke-linejoin','round');

  // Offshore labels
  const [gx,gy]=ll(121.47,22.67);
  svg.append('text').attr('x',gx+15).attr('y',gy+4).attr('font-size',13).attr('font-weight',700).attr('fill','#9A8B78').text('綠島');
  const [ox,oy]=ll(121.53,22.04);
  svg.append('text').attr('x',ox+15).attr('y',oy+4).attr('font-size',13).attr('font-weight',700).attr('fill','#9A8B78').text('蘭嶼');

  // Compute pixel positions for all cities
  Object.entries(CITIES).forEach(([k,c]) => { c.px = ll(c.lon, c.lat); });

  // City dots
  Object.values(CITIES).forEach(c => {
    const [cx,cy] = c.px;
    dotG.append('circle').attr('cx',cx).attr('cy',cy).attr('r',c.r+1)
      .attr('fill',c.col).attr('stroke','#F8F5F0').attr('stroke-width',2); // clean white pop border
  });

  renderGroups();
});

// ════════════════════════════════════════════════════════════════
//  TEXT + LEADER LINES
// ════════════════════════════════════════════════════════════════
const FS   = 15.2;   // Reduced event text size to fit safely
const FSL  = 19;     // Reduced city label size
const RH   = 21;     // Tighter row height
const GAP  = 14;     // Reduced gap between groups
const LX   = 40;     
const RXE  = W-40;   

function renderGroups() {
  renderSide(LEFT_GROUPS,  'L');
  renderSide(RIGHT_GROUPS, 'R');
}

function renderSide(groups, side) {
  const isLeft = side === 'L';
  let prevBottom = 158; // Start right under the title bounding box

  groups.forEach(grp => {
    let sumY = 0;
    grp.cityKeys.forEach(k => sumY += CITIES[k].px[1]);
    const avgDotY = sumY / grp.cityKeys.length;

    const totalH = FSL + grp.events.length * RH;

    // Shift the baseline up by 60 pixels to fill empty top space & relieve bottom pressure
    let top = avgDotY - totalH / 2 - 15 - 60;
    top = Math.max(top, prevBottom + GAP);

    const anchorX = isLeft ? 280 : W - 280; 
    const anchorY = top + totalH / 2;

    // Leader lines cross over gracefully
    grp.cityKeys.forEach(k => {
      const px = CITIES[k].px;
      const startX = isLeft ? anchorX + 6 : anchorX - 6;
      const endX   = isLeft ? px[0] - 8 : px[0] + 8;

      lineG.append('path')
        .attr('d', `M ${startX},${anchorY} C ${isLeft? startX+50 : startX-50},${anchorY} ${isLeft? endX-50 : endX+50},${px[1]} ${endX},${px[1]}`)
        .attr('fill', 'none').attr('stroke', grp.col).attr('stroke-width', 2).attr('stroke-linecap', 'round')
        .attr('opacity', 0.5);
    });

    // Anchor dot
    dotG.append('circle').attr('cx', isLeft ? anchorX+2 : anchorX-2)
        .attr('cy', anchorY).attr('r', 3)
        .attr('fill', '#F8F5F0').attr('stroke', grp.col).attr('stroke-width',2);

    // City label
    const lx      = isLeft ? LX : RXE;
    const anchor  = isLeft ? 'start' : 'end';
    const labelY  = top + FSL;

    svg.append('text').attr('x', lx).attr('y', labelY)
      .attr('font-size', FSL).attr('font-weight', 900)
      .attr('fill', grp.col) 
      .attr('text-anchor', anchor)
      .text(grp.label);

    // Event rows
    let y = labelY + 8 + RH;
    grp.events.forEach(([date, name]) => {
      const row = svg.append('text').attr('x', lx).attr('y', y)
        .attr('font-size', FS).attr('text-anchor', anchor).attr('font-weight', 700);
        
      if(isLeft) {
          row.append('tspan').attr('fill',COL.INK).text(name + '   '); 
          row.append('tspan').attr('fill', grp.col).attr('font-size', 13.5).attr('font-weight', 900).attr('opacity', 0.95).text(date);
      } else {
          row.append('tspan').attr('fill', grp.col).attr('font-size', 13.5).attr('font-weight', 900).attr('opacity', 0.95).text(date + '   ');
          row.append('tspan').attr('fill',COL.INK).text(name);
      }
      y += RH;
    });

    prevBottom = y;
  });
}

// ════════════════════════════════════════════════════════════════
//  BOTTOM BAR - Subtler, cohesive with poster
// ════════════════════════════════════════════════════════════════
const discY = H - 100;
svg.append('line').attr('x1',24).attr('y1',discY-12).attr('x2',W-24).attr('y2',discY-12)
  .attr('stroke',DEC_COL).attr('stroke-width', 2).attr('stroke-dasharray','2,4');
  
svg.append('rect').attr('x',24).attr('y',discY).attr('width',W-48).attr('height',76)
  .attr('fill','#EBE4D5').attr('stroke',DEC_COL).attr('stroke-width',1.5).attr('rx',4); 

svg.append('rect').attr('x',24).attr('y',discY).attr('width',8).attr('height',76)
  .attr('fill',COL.KURENAI).attr('rx',2);

svg.append('text').attr('x',46).attr('y',discY+26)
  .attr('font-size',15).attr('font-weight',900).attr('fill',COL.KURENAI).text('⚠️ 已停辦  / THE DISCONTINUED ERA');

function renderFooterRow(arr, rowY) {
  const tGrp = svg.append('text').attr('x',46).attr('y',rowY).attr('font-size',13).attr('font-weight',700);
  arr.forEach((item, i) => {
    if (i > 0) tGrp.append('tspan').attr('fill',DEC_COL).text('   |   ');
    const parts = item.split(' (');
    tGrp.append('tspan').attr('fill','#685544').text(parts[0] + ' ');
    if (parts[1]) tGrp.append('tspan').attr('fill','#9A8574').attr('font-size',11.5).text('(' + parts[1]);
  });
}
renderFooterRow(FOOTER_DATA.slice(0,5), discY+50);
renderFooterRow(FOOTER_DATA.slice(5), discY+68);

svg.append('text').attr('x',W-30).attr('y',H-10).attr('text-anchor','end')
  .attr('font-size',10).attr('font-weight', 700).attr('fill','#9A8B78').attr('letter-spacing',4).text('SMALLSEEDSVOICE / TAIWAN MUSIC RADAR');
</script>
