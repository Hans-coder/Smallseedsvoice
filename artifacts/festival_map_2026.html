// ════════════════════════════════════════════════════════════════
//  TEXT + LEADER LINES
//  Design: for each group, text is vertically centered at dot Y.
//  A vertical bracket runs along the map edge at the group's span.
//  A horizontal tick at dot Y shows which dot the group connects to.
// ════════════════════════════════════════════════════════════════
const FS   = 12.5;   // event text size
const FSL  = 14.5;   // city label size
const RH   = 13.6;   // row height (tighter)
const GAP  = 6;      // gap between groups
const LX   = 60;     // deeply compressed left x margin
const RXE  = W-60;   // deeply compressed right col x margin

function renderGroups() {
  renderSide(LEFT_GROUPS,  'L');
  renderSide(RIGHT_GROUPS, 'R');
}

function renderSide(groups, side) {
  const isLeft = side === 'L';
  let prevBottom = MTY + 2;

  groups.forEach(grp => {
    // calculate average dot Y for block centering
    let sumY = 0;
    grp.cityKeys.forEach(k => sumY += CITIES[k].px[1]);
    const avgDotY = sumY / grp.cityKeys.length;

    // Total height: label + events
    const totalH = FSL + grp.events.length * RH;

    // Center block at avgDotY, uncoupling the downward motion by 25px
    let top = avgDotY - totalH / 2 - 25;
    top = Math.max(top, prevBottom + GAP);

    // Group anchor coords (dot next to text)
    const anchorX = isLeft ? 240 : W - 240;
    const anchorY = top + totalH / 2;

    // Draw lines to all actual city dots in this group
    grp.cityKeys.forEach(k => {
      const px = CITIES[k].px;
      const r = CITIES[k].r;
      const startX = isLeft ? anchorX + 3 : anchorX - 3;
      const endX   = isLeft ? px[0] - r - 2 : px[0] + r + 2;

      // Draw beautiful S-bezier curve
      lineG.append('path')
        .attr('d', `M ${startX},${anchorY} C ${isLeft? startX+50 : startX-50},${anchorY} ${isLeft? endX-50 : endX+50},${px[1]} ${endX},${px[1]}`)
        .attr('fill', 'none').attr('stroke', grp.col).attr('stroke-width', 1.4).attr('stroke-linecap', 'round').attr('opacity', 0.55);
    });

    // Draw the anchor dot
    dotG.append('circle').attr('cx', anchorX).attr('cy', anchorY).attr('r', 3)
      .attr('fill', '#F3ECE0').attr('stroke', grp.col).attr('stroke-width', 2);

    // ── City label & Alignment ──
    const lx      = isLeft ? LX : RXE;
    const anchor  = isLeft ? 'start' : 'end';
    const labelY  = top + FSL;

    svg.append('text').attr('x', lx).attr('y', labelY)
      .attr('font-size', FSL).attr('font-weight', 700)
      .attr('fill', grp.col).attr('text-anchor', anchor)
      .text(grp.label);

    // ── Event rows ──
    let y = labelY + RH;
    grp.events.forEach(([date, name]) => {
      const row = svg.append('text').attr('x', lx).attr('y', y)
        .attr('font-size', FS).attr('text-anchor', anchor);
      row.append('tspan').attr('fill','#1A1410').text(name + '  ');
      row.append('tspan').attr('fill','#9A8060').attr('font-size', 10.5).text(date);
      y += RH;
    });

    prevBottom = y + 2;
  });
}

// ════════════════════════════════════════════════════════════════
//  BOTTOM BAR — DISCONTINUED
// ════════════════════════════════════════════════════════════════
const discY = H - 90;
svg.append('line').attr('x1',12).attr('y1',discY-8).attr('x2',W-12).attr('y2',discY-8)
  .attr('stroke','#C4B49A').attr('stroke-width', 1.5).attr('stroke-dasharray','5,5');
svg.append('rect').attr('x',12).attr('y',discY).attr('width',W-24).attr('height',82)
  .attr('fill','#EBE3D3').attr('stroke','#C4AE9A').attr('stroke-width',1).attr('rx',4);
svg.append('text').attr('x',28).attr('y',discY+26)
  .attr('font-size',15).attr('font-weight',900).attr('fill','#C0391E').text('⚠ 已停辦  (THE DISCONTINUED ERA)');

function renderFooterRow(arr, rowY) {
  const tGrp = svg.append('text').attr('x',28).attr('y',rowY).attr('font-size',11.5).attr('font-weight',500);
  arr.forEach((item, i) => {
    if (i > 0) tGrp.append('tspan').attr('fill','#C4B8A6').text('   ·   ');
    const parts = item.split(' (');
    tGrp.append('tspan').attr('fill','#6A5D4A').text(parts[0] + ' ');
    if (parts[1]) tGrp.append('tspan').attr('fill','#A48060').attr('font-size',10.5).text('(' + parts[1]);
  });
}
renderFooterRow(FOOTER_DATA.slice(0,5), discY+48);
renderFooterRow(FOOTER_DATA.slice(5), discY+68);

svg.append('text').attr('x',W-14).attr('y',H-9).attr('text-anchor','end')
  .attr('font-size',9).attr('fill','#C0B09A').attr('letter-spacing',2).text('smallseedsvoice');

// ════════════════════════════════════════════════════════════════
//  ONE-CLICK EXPORT BUTTON (For User Convenience)
// ════════════════════════════════════════════════════════════════
const btn = document.createElement('button');
btn.innerHTML = '⬇️ 下載高畫質圖片 (PNG)';
btn.style.cssText = 'position:fixed; bottom:24px; right:24px; padding:12px 24px; background:#4A3020; color:#F3ECE0; border:none; border-radius:30px; font-family:"Noto Sans TC"; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 8px 24px rgba(74,48,32,0.3); transition:all 0.2s;';
btn.onmouseenter = () => btn.style.transform = 'translateY(-2px)';
btn.onmouseleave = () => btn.style.transform = 'translateY(0)';
btn.onclick = () => {
  btn.innerHTML = '匯出中...';
  const svgNode = document.getElementById('main');
  const svgData = new XMLSerializer().serializeToString(svgNode);
  const canvas = document.createElement("canvas");
  canvas.width = 1080; canvas.height = 1080;
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.onload = function() {
    ctx.fillStyle = "#E8E2D4";
    ctx.fillRect(0, 0, 1080, 1080);
    ctx.drawImage(img, 0, 0);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "台灣音樂祭地圖_2026.png";
    a.click();
    btn.innerHTML = '⬇️ 下載高畫質圖片 (PNG)';
  };
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
};
document.body.appendChild(btn);
</script>
</body>
